name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create build folder
        run: mkdir -p build

      - name: Compile Java (skip tests)
        run: javac -d build $(find src -name "*.java" ! -name "*Test.java")

      - name: Run Application
        run: java -cp build Main
